ingestion:
  query: '(ti:"retrieval augmented generation" OR ti:"retrieval-augmented generation" OR ti:RAG) AND (ti:evaluation OR ti:benchmark)'
  max_papers: 10
  page_size: 10
  request_delay_seconds: 3.0
  timeout_seconds: 30.0
  max_pdf_bytes: 52428800
  allowed_licenses: [CC-BY-4.0, CC-BY-3.0, CC0-1.0]

parsing:
  margin_ratio: 0.08
  repeated_margin_ratio: 0.6
  min_repeated_pages: 2
  heading_max_words: 16

chunking:
  target_tokens: 400
  overlap_tokens: 50
  min_tokens: 80
  short_chunk_policy: merge
  tokenizer: lexical-v1

embedding:
  model: BAAI/bge-base-en-v1.5
  revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  max_tokens: 512
  batch_size: 32
  device: cpu

retrieval:
  dense_top_k: 50
  bm25_top_k: 50
  rrf_k: 60
  rerank_candidates: 50
  final_top_k: 8
  use_reranker: true
  reranker_model: BAAI/bge-reranker-base
  query_prefix: 'Represent this sentence for searching relevant passages: '
  reranker_revision: 2cfc18c9415c912f9d8155881c133215df768a70
  reranker_max_tokens: 512
  reranker_batch_size: 16

generation:
  provider: deepseek
  model: deepseek-flash
  thinking: false
  temperature: 0.0
  max_calls_per_run: 200
  max_output_tokens: 2048
  timeout_seconds: 60.0
  base_url: ''

verification:
  minicheck_model: lytang/MiniCheck-Flan-T5-Large
  judge_model: gpt-4o-mini
  judge_provider: openai
  judge_sample_rate: 0.25
  seed: 42

evaluation:
  ks: [5, 10, 20]
  dataset_path: eval/questions.jsonl
  gold_labels_path: eval/gold_labels.jsonl
  output_dir: eval/results

paths:
  raw_dir: data/raw
  parsed_dir: data/parsed
  index_dir: data/index
  cache_dir: data/cache
  db_path: data/index/corpus.db
