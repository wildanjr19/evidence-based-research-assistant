ingestion:
  query: 'ti:IndoBERT OR ti:IndoNLU OR ti:InstructABSA'
  max_papers: 5
  page_size: 5
  request_delay_seconds: 3.0
  timeout_seconds: 30.0
  max_pdf_bytes: 52428800
  allowed_licenses: [CC-BY-4.0, CC-BY-3.0, CC-BY-SA-4.0, CC0-1.0]

parsing:
  margin_ratio: 0.08
  repeated_margin_ratio: 0.6
  min_repeated_pages: 2
  heading_max_words: 16

chunking:
  target_tokens: 220
  overlap_tokens: 40
  min_tokens: 60
  short_chunk_policy: drop
  tokenizer: lexical-v1

embedding:
  model: BAAI/bge-base-en-v1.5
  revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  max_tokens: 512
  batch_size: 16
  device: cpu

retrieval:
  dense_top_k: 50
  bm25_top_k: 50
  rrf_k: 60
  rerank_candidates: 50
  final_top_k: 8
  use_reranker: true
  reranker_model: BAAI/bge-reranker-base
  query_prefix: 'Represent this sentence for searching relevant passages: '
  reranker_revision: 2cfc18c9415c912f9d8155881c133215df768a70
  reranker_max_tokens: 512
  reranker_batch_size: 8

generation:
  provider: deepseek
  model: deepseek-flash
  thinking: false
  temperature: 0.0
  max_calls_per_run: 2
  max_output_tokens: 2048
  timeout_seconds: 60.0
  base_url: ''

verification:
  minicheck_model: lytang/MiniCheck-Flan-T5-Large
  judge_model: gpt-4o-mini
  judge_provider: surplus-chat
  judge_sample_rate: 0.25
  seed: 42
  minicheck_revision: 96eafd01cee2d16cf81aaa2fb226b14f422a37b3
  max_tokens: 512
  batch_size: 2
  device: cpu
  support_threshold: 0.5
  judge_max_calls_per_run: 50

evaluation:
  ks: [5, 10, 20]
  dataset_path: data/skripsi/pilot-v1/evaluation/questions.jsonl
  gold_labels_path: data/skripsi/pilot-v1/evaluation/gold-labels.jsonl
  output_dir: data/skripsi/pilot-v1/reports/evaluation

paths:
  raw_dir: data/skripsi/pilot-v1/raw
  parsed_dir: data/skripsi/pilot-v1/parsed
  index_dir: data/skripsi/pilot-v1/index
  cache_dir: data/cache
  db_path: data/skripsi/pilot-v1/index/corpus.db
