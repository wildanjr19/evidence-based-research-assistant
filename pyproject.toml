[project]
name = "evidence-based-research-assistant"
version = "0.1.0"
description = "RAG lokal untuk literatur ilmiah dengan sitasi per klaim yang terverifikasi"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "pymupdf>=1.24",
  "httpx>=0.27",
  "lancedb>=0.13",
  "sentence-transformers>=3.0",
  "torch>=2.4",
  "openai>=1.40",
  "streamlit>=1.37",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: test yang membutuhkan GPU",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
